<style>
.h-c{transform-box:fill-box;transform-origin:center;animation:h-grow 9s ease-out infinite;opacity:0}
@keyframes h-grow{0%{transform:scaleY(0);opacity:0}6%{transform:scaleY(1);opacity:.9}88%{opacity:.9}100%{opacity:0}}
.h-line{stroke-dasharray:1;stroke-dashoffset:1;animation:h-draw 9s ease-in-out infinite}
@keyframes h-draw{0%{stroke-dashoffset:1}48%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.h-dot{animation:h-pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes h-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(2.4);opacity:0}}
.h-in{opacity:0;animation:h-up .9s ease-out forwards}
@keyframes h-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.h-tick{animation:h-blink 1.2s steps(1) infinite}
@keyframes h-blink{50%{opacity:.35}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){.h-c,.h-line,.h-dot,.h-in,.h-tick{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
