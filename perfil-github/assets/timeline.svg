<text x="446.7" y="96.0" text-anchor="middle" class="t-s" fill="#9198a1">Royal SAS</text>
</g><g class="t-e" style="animation-delay:1.75s">
<line x1="600.0" x2="600.0" y1="150" y2="190" stroke="#E3B341" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="600.0" cy="150" r="7" fill="#0d1117" stroke="#E3B341" stroke-width="3"/>
<text x="600.0" y="210.0" text-anchor="middle" class="t-h">2022 · CME Trading Challenge</text>
<text x="600.0" y="228.0" text-anchor="middle" class="t-s" fill="#E3B341">Top 25 Worldwide</text>
</g><g class="t-e" style="animation-delay:2.20s">
