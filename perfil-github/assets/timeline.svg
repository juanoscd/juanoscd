<text x="753.3" y="80.0" text-anchor="middle" class="t-h">2023 · FI &amp; FX Desk Intern</text>
<text x="753.3" y="96.0" text-anchor="middle" class="t-s" fill="#3fb950">Protección S.A.</text>
</g><g class="t-e" style="animation-delay:2.65s">
<line x1="906.7" x2="906.7" y1="150" y2="190" stroke="#E3B341" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="906.7" cy="150" r="7" fill="#0d1117" stroke="#E3B341" stroke-width="3"/>
<text x="906.7" y="210.0" text-anchor="middle" class="t-h">2023 · CME Trading Challenge</text>
<text x="906.7" y="228.0" text-anchor="middle" class="t-s" fill="#E3B341">5th Place Worldwide 🏆</text>
</g><g class="t-e" style="animation-delay:3.10s">
<line x1="1060.0" x2="1060.0" y1="150" y2="110" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 3"/>
