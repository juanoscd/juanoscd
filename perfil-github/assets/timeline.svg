<text x="1060.0" y="96.0" text-anchor="middle" class="t-s" fill="#3fb950">Freelance · Present</text>
</g>
<circle class="t-now" cx="1060.0" cy="150" r="7" fill="#3fb950"/>
<text x="600.0" y="284" text-anchor="middle" class="t-y">Career timeline · 2018 → today</text>
