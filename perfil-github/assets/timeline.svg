<text x="293.3" y="210.0" text-anchor="middle" class="t-h">2020 · Customer Service (EN)</text>
<text x="293.3" y="228.0" text-anchor="middle" class="t-s" fill="#9198a1">Teleperformance</text>
</g><g class="t-e" style="animation-delay:1.30s">
<line x1="446.7" x2="446.7" y1="150" y2="110" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="3 3"/>
